<body>
  <main id="stage" aria-label="Frostlight 冰蓝圣诞">
    <div id="viewport"></div>
    <div id="controls" class="controls" aria-label="绘画控制">
      <div class="track">
        <input type="range" id="timeline" min="0" max="16" step="0.01" value="0" aria-label="绘画时间轴">
        <output id="current-time" for="timeline">0:00</output>
      </div>
      <div class="tools">
        <button id="play-toggle" type="button" aria-label="暂停" title="播放或暂停（空格）">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor" stroke="none"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
        </button>
        <button id="restart" type="button" aria-label="重新绘制" title="重新绘制">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2 6.2M4 5v6h6"/></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button id="camera-mode" class="camera-mode" type="button" aria-label="自由观察" title="自由观察" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="5" transform="rotate(-25 12 12)"/><circle cx="12" cy="12" r="2.3"/><path d="M5 6l.01.01m14 12l.01.01"/></svg>
          <span id="camera-label">自动运镜</span>
        </button>
        <button id="reset-camera" type="button" aria-label="恢复默认视角" title="恢复默认视角" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <label class="speed" title="绘画速度">
          <select id="speed" aria-label="绘画速度">
            <option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
          </select>
        </label>
        <button id="music-toggle" type="button" aria-label="背景音乐" aria-pressed="false" title="开启背景音乐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17V6l10-2v11M10 9l10-2"/><ellipse cx="7" cy="17" rx="3" ry="2.3"/><ellipse cx="17" cy="15" rx="3" ry="2.3"/></svg>
        </button>
        <button id="fullscreen" type="button" aria-label="全屏" title="切换全屏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11 0h5v-5"/></svg>
        </button>
        <button id="hide-controls" type="button" aria-label="隐藏控制栏" title="隐藏控制栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
    <audio id="music-audio" preload="none" loop hidden></audio>
    <button id="show-controls" class="show-controls" type="button" aria-label="显示控制栏" title="显示控制栏" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <p id="status" class="status" role="status">正在准备画布…</p>
    <details id="developer" class="developer" hidden>
      <summary>开发者模式</summary>
      <label>渲染质量 <select id="quality" aria-label="渲染质量"><option value="low">低</option><option value="medium">中</option><option value="high" selected>高</option></select></label>
      <label>泛光 <input data-setting="bloom" type="range" min="0" max="2" step=".01"></label>
      <label>粒子密度 <input data-setting="particleDensity" type="range" min="0" max="2" step=".05"></label>
      <label>笔刷密度 <input data-setting="brushDensity" type="range" min=".45" max="1.6" step=".05"></label>
      <label>背景 <input data-setting="backgroundColor" type="color"></label>
      <label>树体 <input data-setting="treeColor" type="color"></label>
      <label>收件人 <input data-setting="recipient" type="text" maxlength="48"></label>
      <label>种子 <input data-setting="seed" type="number" min="0" max="4294967295" required></label>
      <div id="layers" class="layers"></div>
    </details>
  </main>
</body>
</html>
